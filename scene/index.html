<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root{--cream:#f6efd9;--ink:#1a1a1a;--yel:#ffd23a;--stroke:#1a1a1a}
  html,body{margin:0;background:#000;overflow:hidden}
  body,#stage{font-family:'Lilita One','Arial Black',Impact,sans-serif}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden}
  canvas{display:block;width:1080px;height:1920px}
  .abs{position:absolute}
  .sticker{background:var(--cream);border:5px solid var(--ink);border-radius:18px;box-shadow:0 7px 0 rgba(0,0,0,.32);color:var(--ink)}
  #badge{left:46px;top:70px;padding:4px 24px 6px;font-size:46px;line-height:1.1;letter-spacing:1px}
  #hook{left:50%;top:330px;transform:translateX(-50%);background:#1f1d1b;border:6px solid #0c0b0a;border-radius:28px;
    padding:6px 54px 12px;font-size:190px;line-height:1.05;color:var(--yel);box-shadow:0 12px 0 rgba(0,0,0,.35);opacity:0;white-space:nowrap}
  #card{left:46px;top:170px;width:560px;opacity:0}
  #card .row{margin-bottom:16px;padding:12px 22px 14px;opacity:0}
  .lab{font-size:22px;letter-spacing:2px;color:#7a6a55;line-height:1}
  .big{font-size:42px;line-height:1.1}
  .big b{color:#d8442b;font-weight:400}
  #census{left:46px;top:170px;width:470px;padding:14px 22px 16px;opacity:0}
  #census .hd{font-size:20px;letter-spacing:3px;color:#c0572b}
  #census .r{display:flex;justify-content:space-between;align-items:center;font-size:38px;margin-top:8px}
  #census .n{min-width:64px;text-align:center;border:4px solid var(--ink);border-radius:12px;background:#fff;font-size:40px;padding:0 10px}
  #census .n.hot{background:#ffb199}
  #drone{inset:0;opacity:0;pointer-events:none}
  #drone .br{position:absolute;width:90px;height:90px;border:0 solid rgba(255,255,255,.85)}
  #drone .tl{left:70px;top:330px;border-left-width:6px;border-top-width:6px}
  #drone .tr{right:70px;top:330px;border-right-width:6px;border-top-width:6px}
  #drone .bl{left:70px;top:1150px;border-left-width:6px;border-bottom-width:6px}
  #drone .br2{right:70px;top:1150px;border-right-width:6px;border-bottom-width:6px}
  #drone .hud{position:absolute;left:100px;top:350px;color:rgba(255,255,255,.9);font-size:26px;line-height:1.3;letter-spacing:2px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
  #drone .rec{position:absolute;right:90px;top:345px;color:#ff5a4d;font-size:28px;letter-spacing:3px}
  #drone .plus{position:absolute;left:530px;top:730px;color:rgba(255,255,255,.85);font-size:60px;line-height:1}
  #dtitle{left:50%;top:150px;transform:translateX(-50%);padding:6px 26px 8px;font-size:34px;letter-spacing:2px;white-space:nowrap}
  #end{left:0;right:0;top:165px;text-align:center;opacity:0}
  #end .s{color:var(--yel);font-size:48px;letter-spacing:6px;-webkit-text-stroke:10px var(--stroke);paint-order:stroke fill}
  #end .d{color:var(--yel);font-size:210px;line-height:1;-webkit-text-stroke:22px var(--stroke);paint-order:stroke fill;text-shadow:0 12px 0 rgba(0,0,0,.35)}
  #end .u{display:inline-block;margin-top:10px;color:#fff;font-size:42px;-webkit-text-stroke:9px var(--stroke);paint-order:stroke fill}
  #comment{left:90px;top:520px;padding:10px 24px 14px;max-width:640px;opacity:0;border-radius:26px 26px 26px 6px}
  #comment .lab{font-size:22px;color:#4a7a9a}#comment .big{font-size:40px}
  #idcard{left:46px;top:170px;width:640px;padding:14px 22px 18px;opacity:0}
  #idcard .hd{font-size:20px;letter-spacing:3px;color:#c0572b}#idcard .tt{font-size:40px;line-height:1.05;margin-bottom:8px}
  #idcard .bd{display:flex;gap:18px;align-items:center}
  #idcard .av{width:96px;height:112px;border:4px dashed var(--ink);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:70px;background:#fff}
  #idcard .ln{font-size:28px;line-height:1.35}
  #live{left:46px;top:170px;padding:8px 24px 10px;opacity:0}
  #live .dot{display:inline-block;width:20px;height:20px;border-radius:50%;background:#e03a2a;vertical-align:middle;margin-right:4px}#live .t{font-size:34px;letter-spacing:1px}
  #follow{left:50%;top:190px;transform:translateX(-50%);background:#ef4b3f;color:#fff;border:6px solid var(--ink);border-radius:20px;padding:10px 44px 14px;font-size:62px;white-space:nowrap;box-shadow:0 9px 0 rgba(0,0,0,.35);opacity:0;-webkit-text-stroke:0}
  #kpi{left:46px;top:170px;width:600px;padding:14px 22px 16px;opacity:0}
  #kpi .hd{font-size:20px;letter-spacing:3px;color:#c0572b}
  #kpi .g{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin-top:6px}
  #kpi .c{display:flex;justify-content:space-between;align-items:baseline;font-size:26px}
  #kpi .c b{font-weight:400;font-size:38px}
  #kpi .bar{margin-top:12px;height:20px;border:4px solid var(--ink);border-radius:12px;background:#fff;overflow:hidden}
  #kpi .bar i{display:block;height:100%;background:#4fd36b}
  #kpi .goal{font-size:24px;margin-top:6px}
  /* ---- futuristic theme ---- */
  #stage.future{--cream:rgba(6,22,46,.84);--ink:#37e9ff;--yel:#d7ff3a;--stroke:#05122b;font-family:'Orbitron','Arial Black',sans-serif;font-weight:900}
  .future .sticker{color:#e6fbff;box-shadow:0 0 18px rgba(55,233,255,.65),inset 0 0 14px rgba(55,233,255,.25);border-width:3px;border-radius:10px;backdrop-filter:none}
  .future #badge{font-size:36px;padding:6px 20px}
  .future .lab,.future #census .hd,.future #idcard .hd,.future #kpi .hd{color:#7fdcff}
  .future .big b{color:#ff4fd8}
  .future #hook{background:rgba(4,16,38,.88);border:5px solid #37e9ff;border-radius:14px;color:var(--yel);font-size:150px;box-shadow:0 0 40px rgba(55,233,255,.8)}
  .future #cap{font-size:84px;letter-spacing:0;-webkit-text-stroke:14px var(--stroke);text-shadow:0 0 22px rgba(55,233,255,.7)}
  .future #end .d{font-size:170px;text-shadow:0 0 30px rgba(55,233,255,.9)}
  .future #end .s{font-size:40px}
  .future #end .u{font-size:30px}
  .future #follow{background:linear-gradient(90deg,#ff4fd8,#7a5cff);border-color:#37e9ff;font-size:44px;box-shadow:0 0 28px rgba(255,79,216,.8)}
  .future #census .n,.future #kpi .bar{background:#06162e}
  .future #idcard .av{background:#06162e}
  .future #comment .big{font-size:34px}
  .future #card .big{font-size:34px}
  .future #live .t{font-size:28px}
  .future #dtitle{font-size:26px}
  #cap{left:40px;right:40px;top:1300px;text-align:center;font-size:112px;line-height:1.02;color:#fff;
    -webkit-text-stroke:16px var(--stroke);paint-order:stroke fill;text-shadow:0 9px 0 rgba(0,0,0,.35);opacity:0;transform-origin:50% 60%}
  #cap .hl{color:var(--yel)}
</style></head>
<body><div id="stage"><canvas id="c" width="1080" height="1920"></canvas>
<div id="badge" class="abs sticker">DAY 1</div>
<div id="hook" class="abs">DAY 1</div>
<div id="card" class="abs"><div class="row sticker"><div class="lab"></div><div class="big"></div></div><div class="row sticker"><div class="lab"></div><div class="big"></div></div></div>
<div id="comment" class="abs sticker"><div class="lab"></div><div class="big"></div></div>
<div id="idcard" class="abs sticker"><div class="hd"></div><div class="tt">KARTU TANDA RAKYAT</div><div class="bd"><div class="av">?</div><div class="ln"></div></div></div>
<div id="live" class="abs sticker"><span class="dot"></span><span class="t"></span></div>
<div id="follow" class="abs"></div>
<div id="kpi" class="abs sticker"><div class="hd">STATUS NEGARA</div><div class="g"><div class="c"><span>Penduduk</span><b id="kp">0</b></div><div class="c"><span>Pajak</span><b id="kj">0</b></div><div class="c"><span>Pengaruh</span><b id="kg">0</b></div><div class="c"><span>Inspirasi</span><b id="ki">0</b></div></div><div class="goal" id="kgoal"></div><div class="bar"><i id="kbar"></i></div></div>
<div id="census" class="abs sticker"><div class="hd">SENSUS NEGARA</div>
  <div class="r"><span>Followers</span><span class="n" id="cf">0</span></div>
  <div class="r"><span>Penduduk</span><span class="n hot" id="cp">1</span></div></div>
<div id="drone" class="abs"><div class="br tl"></div><div class="br tr"></div><div class="br bl"></div><div class="br br2"></div>
  <div class="plus">+</div><div class="rec">&#9679; REC</div><div class="hud" id="hud"></div></div>
<div id="dtitle" class="abs sticker" style="opacity:0">TUR NEGARA &middot; VIA DRONE</div>
<div id="end" class="abs"><div class="s">BESOK</div><div class="d">DAY 2</div><div class="u"></div></div>
<div id="cap" class="abs"></div></div>
<script type="module" src="./main.js"></script></body></html>
